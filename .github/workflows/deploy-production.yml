name: Deploy to production

on:
  workflow_run:
    workflows:
      - Publish Docker image
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Request Dokploy deployment
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "::error::DOKPLOY_DEPLOY_WEBHOOK is not configured."
            exit 1
          fi

          curl --fail --silent --show-error --max-time 30 \
            --output /dev/null \
            --write-out 'Dokploy accepted the deployment request (HTTP %{http_code}).\n' \
            --request POST "$DOKPLOY_DEPLOY_WEBHOOK"

      - name: Summarize deployment request
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          {
            printf '## Production deployment requested\n\n'
            printf '%s\n' '- **Status:** Dokploy accepted the request; deployment continues asynchronously.'
            printf '%s\n' "- **Source:** [\`$SOURCE_BRANCH\` @ \`$SOURCE_SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SOURCE_SHA)"
            printf '%s\n' "- **Image:** \`ghcr.io/$GITHUB_REPOSITORY:$SOURCE_BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"
